<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Insightful Recommender ✨</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="hero">
    <div class="glass-panel">
      <div class="header-copy">
        <p class="eyebrow">AI-powered recommendations</p>
        <h1>✨ Insightful Recommender ✨</h1>
        <p class="intro">Type a movie title and discover curated recommendations with similarity scores, genres, and ratings.</p>
      </div>

      <div class="search-bar">
        <input id="item-input" type="text" placeholder="Enter a movie title like Inception" />
        <button id="recommend-btn">Get Recommendations</button>
      </div>

      <div id="status" class="status">Try "Inception", "The Matrix", or "La La Land".</div>
    </div>
  </div>

  <main class="results-section">
    <div class="results-header">
      <h2>Recommended Picks</h2>
      <p>Beautiful, judge-friendly cards that explain your recommendations.</p>
    </div>
    <div id="results-grid" class="results-grid"></div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
